# nginx in front of the PM2 process (port 3100). Replace the domain, then:
#   sudo cp deploy/nginx/tvarovna.conf /etc/nginx/sites-available/tvarovna
#   sudo ln -s /etc/nginx/sites-available/tvarovna /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hra.example.cz      # HTTPS from Let's Encrypt
server {
    listen 80;
    server_name hra.example.cz;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # WebSocket (/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Snapshots of big factories
        client_max_body_size 16m;
    }
}
