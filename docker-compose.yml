# Local run or a single VPS:  docker compose up -d --build
# The game listens on 127.0.0.1:3100 only. On a VPS the existing reverse proxy
# (nginx, see deploy/nginx/tvarovna.conf) serves the domain with HTTPS and
# forwards to it, so ports 80/443 and the other sites stay untouched.
# Locally open http://localhost:3100
services:
    tvarovna:
        build: .
        image: tvarovna:latest
        ports:
            # Docker bypasses ufw, never publish on all interfaces
            - "${BIND:-127.0.0.1}:${PORT:-3100}:8080"
        environment:
            # Optional global password for creating and joining worlds
            SERVER_PASSWORD: ${SERVER_PASSWORD:-}
            # Shown in the game, the GPL requires the source to be available
            SOURCE_URL: ${SOURCE_URL:-https://github.com/pesektomas/shapez-community-edition}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            BACKUP_INTERVAL_HOURS: "24"
            BACKUP_KEEP: "7"
        volumes:
            - tvarovna-data:/data
        restart: unless-stopped

volumes:
    tvarovna-data: {}
